<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<title>Cue — Your first script</title>
<style>
/* 1.4 Chapter 3, redrawn from main (03/11/2026): ScriptChapter + MessageCard + MessageTimeline/MessageWords. A clean glass card (aurora on night indigo, .75 pt glassBorder edge; no brackets,
   turning ring, specks or "✦ PRACTICE SCRIPT" header: the script is fixed, no AI). On top the platform's dot, "VIDEO FOR · TIKTOK" and a 12 pt ring in the platform's colour that fills as the words
   arrive and ends in a ✓ (5.5 s) with the reading time counting up to "24 SEC"; HOOK / BODY / CTA in quiet ink over words in the same ink (semibold, out of a blur, a glow that fades), a caret that
   blinks after the last word and goes; when it is all there one soft cream line runs down the card (6.1–7.35 s). "It’s just practice. Nothing is recorded." stays under it; "Try the teleprompter" is
   glass until the ✓ and then shines. A tap skips to the end. Words from 1.9 s at the board's rhythm (hook, body, cta). */
body{margin:0;background:#000}*{box-sizing:border-box}
.phone{width:390px;height:844px;position:relative;overflow:hidden;font-family:-apple-system,"SF Pro Text",system-ui,sans-serif;color:#fff;background:#07080E;display:flex;flex-direction:column;padding:54px 0 34px}
.mono{font-family:ui-monospace,"SF Mono",Menlo,monospace}
.lab{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:10px;font-weight:600;letter-spacing:1px;margin-bottom:4px;color:rgba(225,228,245,.55);opacity:0;transition:opacity .4s}
.w{display:inline-block;opacity:0;filter:blur(6px);transform:translateY(4px);transition:opacity .4s,filter .4s,transform .4s;font-weight:600;white-space:pre}.w.in{opacity:1;filter:none;transform:none;text-shadow:0 0 10px rgba(255,246,194,.6);animation:glow .9s ease-out forwards}
@keyframes glow{to{text-shadow:0 0 0 rgba(255,246,194,0)}}
@keyframes caret{50%{opacity:.15}}
@keyframes scan{from{top:4%;opacity:1}to{top:96%;opacity:0}}
@keyframes shine{0%,86%{transform:translateX(-140%)}100%{transform:translateX(360%)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div class="phone" id="ph">
  <div style="margin-top:8px;height:44px;padding:0 20px;display:flex;align-items:center;gap:5px;flex-shrink:0">
    <span style="width:22px;height:4px;border-radius:2px;background:rgba(255,255,255,.85)"></span><span style="width:22px;height:4px;border-radius:2px;background:rgba(255,255,255,.85)"></span><span style="width:22px;height:4px;border-radius:2px;background:#FFD60A"></span><span style="width:22px;height:4px;border-radius:2px;background:rgba(110,116,150,.26)"></span><span style="width:22px;height:4px;border-radius:2px;background:rgba(110,116,150,.26)"></span>
  </div>
  <div style="padding:0 20px;display:flex;flex-direction:column;gap:10px;flex-shrink:0">
    <div class="mono" style="font-size:12px;font-weight:600;letter-spacing:1.4px;color:#FFD60A">CHAPTER 3 · YOUR FIRST SCRIPT</div>
    <div style="font-size:30px;line-height:36px;font-weight:700;letter-spacing:-.6px">Your first script. Ready to read.</div>
    <div style="font-size:15px;line-height:20px;color:rgba(225,228,245,.62)">Read it out loud on the teleprompter.</div>
  </div>
  <div style="flex:0 0 20px"></div>
  <!-- MessageCard -->
  <div id="card" style="margin:0 16px;position:relative;border-radius:22px;overflow:hidden;min-height:300px;padding:16px 18px 18px;box-shadow:inset 0 0 0 .75px rgba(180,167,255,.22),0 20px 25px rgba(40,20,120,.22);background:radial-gradient(80% 60% at 10% 0,rgba(157,140,255,.30),rgba(157,140,255,0) 70%),radial-gradient(70% 60% at 100% 100%,rgba(94,78,224,.30),rgba(94,78,224,0) 70%),#1B1740;flex-shrink:0">
    <div style="height:18px;display:flex;align-items:center;gap:8px">
      <span style="width:7px;height:7px;border-radius:4px;background:#64D2FF;box-shadow:0 0 4px #64D2FF"></span>
      <span class="mono" style="font-size:10px;font-weight:600;letter-spacing:1px;color:rgba(225,228,245,.55)">VIDEO FOR · TIKTOK</span>
      <span style="flex:1"></span>
      <svg width="16" height="16" viewBox="0 0 16 16" style="display:block"><circle cx="8" cy="8" r="6" fill="none" stroke="rgba(225,228,245,.45)" stroke-width="2"/><circle id="prog" cx="8" cy="8" r="6" fill="none" stroke="#64D2FF" stroke-width="2" stroke-linecap="round" stroke-dasharray="37.7" stroke-dashoffset="37.7" transform="rotate(-90 8 8)" style="filter:drop-shadow(0 0 2px rgba(100,210,255,.6))"/><path id="chk" d="M5.4 8.2l1.7 1.7 3.4-3.6" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" opacity="0"/></svg>
      <span id="sec" class="mono" style="font-size:10px;font-weight:600;letter-spacing:1px;color:rgba(225,228,245,.62);font-variant-numeric:tabular-nums;min-width:42px;text-align:right">0 SEC</span>
    </div>
    <div id="body" style="margin-top:18px;display:flex;flex-direction:column;gap:9px;font-size:16px;line-height:21px"></div>
    <div id="scan" style="position:absolute;left:0;right:0;top:4%;height:1px;background:linear-gradient(90deg,rgba(255,246,194,0),rgba(255,246,194,.4) 30%,rgba(255,246,194,.4) 70%,rgba(255,246,194,0));box-shadow:0 0 8px rgba(255,246,194,.4);opacity:0"></div>
  </div>
  <div id="caps" class="mono" style="margin:20px 16px 0;height:34px;border-radius:17px;background:rgba(255,214,10,.12);box-shadow:inset 0 0 0 .5px rgba(255,214,10,.38);display:flex;align-items:center;justify-content:center;gap:8px;font-size:11px;font-weight:600;letter-spacing:1px;color:#FFD60A;opacity:0;transition:opacity .5s;flex-shrink:0"><span>✓</span>SCRIPT READY · LET’S TRY IT</div>
  <div id="note" style="margin-top:12px;padding:0 20px;text-align:center;font-size:12.5px;color:rgba(225,228,245,.55);flex-shrink:0">It’s just practice. Nothing is recorded.</div>
  <div style="flex:1;min-height:12px"></div>
  <div style="padding:0 16px;flex-shrink:0">
    <div id="go" role="button" style="position:relative;overflow:hidden;height:54px;border-radius:27px;background:rgba(255,214,10,.2);box-shadow:inset 0 0 0 .75px rgba(255,214,10,.35);color:rgba(255,255,255,.8);font-size:17px;font-weight:700;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background .5s,color .5s,box-shadow .5s">Try the teleprompter<span id="shine" aria-hidden="true" style="position:absolute;top:0;bottom:0;left:0;width:40%;background:linear-gradient(100deg,rgba(255,255,255,0),rgba(255,255,255,.55),rgba(255,255,255,0));transform:translateX(-140%);opacity:0"></span></div>
  </div>
</div>
<script>
(function(){function f(){document.body.style.zoom=Math.min(1,(innerHeight-8)/860)}f();addEventListener('resize',f)})();
(function(){
  var S=[['HOOK','An idea is good. Seeing it become a video is even better.',1.9,.5],['BODY','Cue Studio helps me write it, read it with a teleprompter that follows my voice, and record it right here. I can add automatic captions and edit my take before sharing it.',2.9,1.5],['CTA','My idea gets to sound like me and reach the people I made it for.',4.7,.7]];
  var body=document.getElementById('body'),words=[],labs=[],reduce=matchMedia('(prefers-reduced-motion: reduce)').matches,caret;
  S.forEach(function(s,i){var d=document.createElement('div');var l=document.createElement('div');l.className='lab';l.textContent=s[0];d.appendChild(l);labs.push([l,s[2]-.35]);var p=document.createElement('div');p.style.color='#fff';var ws=s[1].split(' ');
    ws.forEach(function(w,k){var e=document.createElement('span');e.className='w';e.textContent=w+(k<ws.length-1?' ':'');p.appendChild(e);words.push([e,s[2]+s[3]*(ws.length<2?0:k/(ws.length-1))]);});
    if(i===2){caret=document.createElement('span');caret.style.cssText='display:inline-block;width:2px;height:17px;background:rgba(225,228,245,.62);vertical-align:-3px;margin-left:1px;opacity:0';p.appendChild(caret);}d.appendChild(p);body.appendChild(d);});
  var prog=document.getElementById('prog'),sec=document.getElementById('sec'),N=words.length,done=false;
  function at(t,fn){reduce?fn():setTimeout(fn,t*1000);}
  labs.forEach(function(l){at(l[1],function(){l[0].style.opacity=1;});});
  words.forEach(function(w,i){at(w[1],function(){w[0].classList.add('in');var fr=(i+1)/N;prog.setAttribute('stroke-dashoffset',37.7*(1-fr));sec.textContent=Math.round(24*fr)+' SEC';});});
  at(5.4,function(){caret.style.opacity=1;caret.style.animation='caret 1s steps(1) infinite';});
  at(5.5,finish);
  at(6.1,function(){var sc=document.getElementById('scan');if(!reduce)sc.style.animation='scan 1.25s ease-in-out forwards';});
  at(7.5,function(){caret.style.animation='none';caret.style.opacity=0;});
  function finish(){if(done)return;done=true;document.getElementById('chk').setAttribute('opacity',1);prog.setAttribute('stroke-dashoffset',0);sec.textContent='24 SEC';
    document.getElementById('caps').style.opacity=1;var g=document.getElementById('go');g.style.background='#FFD60A';g.style.color='#000';g.style.boxShadow='none';var sh=document.getElementById('shine');sh.style.opacity=1;sh.style.animation='shine 5s .8s infinite';}
  // a tap skips to the end
  document.getElementById('card').addEventListener('click',function(){labs.forEach(function(l){l[0].style.opacity=1});words.forEach(function(w){w[0].classList.add('in')});caret.style.opacity=0;finish();});
})();
</script>
</body></html>
