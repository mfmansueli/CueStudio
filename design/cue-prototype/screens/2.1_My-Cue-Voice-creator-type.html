<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>Cue — Creator type</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&amp;family=Geist+Mono:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#000}
*{box-sizing:border-box}
.night{width:390px;height:844px;position:relative;overflow:hidden;font-family:Geist,-apple-system,sans-serif;color:#fff;background:radial-gradient(70% 30% at 20% 6%,rgba(157,140,255,0.20),rgba(157,140,255,0) 70%),radial-gradient(55% 28% at 85% 60%,rgba(94,78,224,0.12),rgba(94,78,224,0) 70%),#0A0B12}
.stars{background-image:radial-gradient(1.3px 1.3px at 22px 38px,rgba(255,255,255,0.75),transparent),radial-gradient(1px 1px at 88px 142px,rgba(228,222,255,0.6),transparent),radial-gradient(1.6px 1.6px at 151px 64px,rgba(255,255,255,0.55),transparent),radial-gradient(1px 1px at 203px 211px,rgba(255,255,255,0.45),transparent),radial-gradient(1.2px 1.2px at 262px 30px,rgba(228,222,255,0.7),transparent),radial-gradient(1px 1px at 318px 168px,rgba(255,255,255,0.5),transparent),radial-gradient(1.4px 1.4px at 360px 92px,rgba(255,236,170,0.55),transparent),radial-gradient(1px 1px at 45px 250px,rgba(255,255,255,0.4),transparent),radial-gradient(1px 1px at 128px 290px,rgba(228,222,255,0.45),transparent),radial-gradient(1.2px 1.2px at 290px 268px,rgba(255,255,255,0.5),transparent);background-size:390px 310px;animation:drift 160s linear infinite}
@keyframes drift{from{background-position:0 0}to{background-position:0 310px}}
.mono{font-family:'Geist Mono',ui-monospace,monospace}
.scroll{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none}.scroll::-webkit-scrollbar{display:none}
.glass{background:linear-gradient(180deg,rgba(255,255,255,0.16),rgba(255,255,255,0.06));border:0.5px solid rgba(255,255,255,0.2);box-shadow:inset 0 1px 0 rgba(255,255,255,0.25);-webkit-backdrop-filter:blur(20px) saturate(170%);backdrop-filter:blur(20px) saturate(170%)}
button{font:inherit;color:inherit;border:0;background:none;padding:0;margin:0;cursor:pointer;text-align:inherit}
.circ{width:44px;height:44px;border-radius:22px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ink2{color:rgba(225,228,245,0.62)}.hint{color:rgba(225,228,245,0.5)}.acc{color:#FFD60A}.ai{color:#B4A7FF}
.sep{height:1px;background:rgba(80,86,120,0.4);margin-left:16px}
.dim{position:absolute;inset:0;background:rgba(0,0,0,0.42)}
.sheet{position:absolute;left:0;right:0;bottom:0;top:56px;border-radius:38px 38px 0 0;background:rgba(22,24,38,0.97);box-shadow:inset 0 0.5px 0 rgba(255,255,255,0.18);overflow:hidden}
.grab{position:absolute;left:50%;top:6px;width:36px;height:5px;margin-left:-18px;border-radius:3px;background:rgba(235,235,245,0.3);z-index:3}
.card{border-radius:16px;background:#1F2236;overflow:hidden}
.radio{width:24px;height:24px;border-radius:12px;box-shadow:inset 0 0 0 2px rgba(225,228,245,0.3);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:transparent}
.on .radio{box-shadow:inset 0 0 0 2px #FFD60A,inset 0 0 0 5px rgba(22,24,38,1),inset 0 0 0 12px #FFD60A}.on .radio.chk{box-shadow:none;background:#FFD60A;color:#000}
.cta{width:100%;height:54px;border-radius:27px;background:#FFD60A;color:#000;font-size:17px;font-weight:700;text-align:center}
.link{width:100%;min-height:44px;text-align:center;font-size:15px;font-weight:600}
.bbar{position:absolute;left:0;right:0;bottom:0;padding:24px 16px 30px;background:linear-gradient(rgba(22,24,38,0),rgba(22,24,38,0.98) 30%);display:flex;flex-direction:column;gap:4px;z-index:3}
.q{font-size:28px;line-height:33px;font-weight:700;letter-spacing:-0.56px}
.dimmed{opacity:.45}.rc{width:100%;min-height:112px;padding:12px;border-radius:16px;background:#1F2236;display:flex;flex-direction:column;gap:8px;text-align:left}.rc.on{background:rgba(255,214,10,0.12);box-shadow:inset 0 0 0 2px #FFD60A}
.fchip{height:40px;padding:0 14px;border-radius:20px;background:rgba(110,116,150,0.26);font-size:15px;font-weight:500;white-space:nowrap}.fchip.on{background:#fff;color:#000;font-weight:600}
.lvl{flex:1;min-height:44px;border-radius:22px;background:rgba(110,116,150,0.26);font-size:15px;font-weight:600;text-align:center}.lvl.on{background:#fff;color:#000}
.rr{display:flex;align-items:center;gap:12px;width:100%;min-height:52px;padding:0 16px}
.kc{display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 14px;border-radius:20px;background:rgba(110,116,150,0.26);font-size:15px;font-weight:500;white-space:nowrap}.kc.on{background:rgba(255,214,10,0.14);box-shadow:inset 0 0 0 1px rgba(255,214,10,0.6);color:#FFD60A;font-weight:600}.kc.more{color:#B4A7FF}.ac{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:16px;background:rgba(110,116,150,0.26);font-size:14px;font-weight:500;white-space:nowrap;flex-shrink:0}.ac.on{background:#fff;color:#000;font-weight:600}.areas::-webkit-scrollbar{display:none}</style>
</head>
<body>
<div class="night">
<div class="dim"></div>
<div class="sheet">
<div class="grab"></div>
<div style="position:absolute;left:16px;right:16px;top:14px;height:44px;display:flex;align-items:center;gap:10px;z-index:2">
  
  <div style="display:flex;align-items:center;gap:10px"><span style="display:flex;gap:4px"><span style="width:26px;height:4px;border-radius:2px;background:#FFD60A"></span><span style="width:26px;height:4px;border-radius:2px;background:rgba(110,116,150,0.26)"></span><span style="width:26px;height:4px;border-radius:2px;background:rgba(110,116,150,0.26)"></span><span style="width:26px;height:4px;border-radius:2px;background:rgba(110,116,150,0.26)"></span><span style="width:26px;height:4px;border-radius:2px;background:rgba(110,116,150,0.26)"></span></span><span class="mono ink2" style="font-size:11px;font-weight:600;letter-spacing:0.06em">01 / 05</span></div>
  <div style="flex:1"></div>
  <button class="ink2" style="font-size:17px;min-height:44px">Not now</button>
</div>
<div class="scroll" style="top:62px;padding:16px 16px 210px;display:flex;flex-direction:column;gap:18px">
<div style="display:flex;flex-direction:column;gap:6px"><div class="q">What kind of creator are you?</div><div class="ink2" style="font-size:15px">Pick the closest. Change it anytime.</div></div>
<div style="display:flex;align-items:center;gap:8px;height:44px;padding:0 14px;border-radius:22px;background:rgba(110,116,150,0.26)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="rgba(225,228,245,0.62)" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><span class="ink2" style="font-size:16px">Search: lawyer, chef, gamer…</span></div>
<div style="display:flex;flex-direction:column;gap:6px"><div class="ink2" style="font-size:13px;font-weight:600;padding:0 4px">Browse by area</div><div class="areas" style="display:flex;gap:6px;overflow-x:auto;margin:0 -16px;padding:0 16px;scrollbar-width:none"><button class="ac on"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.8l2.5 5.1 5.6.8-4.1 4 1 5.6-5-2.6-5 2.6 1-5.6-4.1-4 5.6-.8z"/></svg>Popular</button><button class="ac"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="13" height="12" rx="3"/><path d="M16 10l5-3v10l-5-3z"/></svg>Creators & influencers</button><button class="ac"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="3"/><path d="M9 7V5h6v2M3 13h18"/></svg>Business & sales</button><button class="ac"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3v6a4 4 0 0 0 8 0V3M10 13v2a4 4 0 0 0 8 0v-1"/><circle cx="18" cy="12" r="2"/></svg>Health & wellness</button><button class="ac"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8a2 2 0 1 0-2-2M12 8v2L3 17h18l-9-7"/></svg>Beauty & fashion</button><button class="ac"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="14" cy="5" r="2"/><path d="M8 20l3-6 3 2 2 4M10 9l4 1 2 3"/></svg>Fitness & sports</button><button class="ac"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3v8M5 3v5a2 2 0 0 0 4 0V3M7 11v10M17 3c-2 2-2 6 0 8v10"/></svg>Food</button><button class="ac"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 9.5L12 5l9.5 4.5L12 14z"/><path d="M6.5 11.5v4.5c3 2.2 8 2.2 11 0v-4.5"/></svg>Education</button></div></div>
<div data-group data-cap="1" style="display:flex;flex-wrap:wrap;gap:8px 8px"><button class="kc" data-opt>Content creator</button><button class="kc" data-opt>Small business owner</button><button class="kc on" data-opt><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg>Lifestyle creator</button><button class="kc" data-opt>Influencer</button><button class="kc" data-opt>Entrepreneur</button><button class="kc" data-opt>Teacher</button><button class="kc" data-opt>Personal trainer</button><button class="kc" data-opt>UGC creator</button><button class="kc" data-opt>Nutritionist or dietitian</button><button class="kc" data-opt>Beauty creator</button><button class="kc" data-opt>Life or relationship coach</button><button class="kc" data-opt>Lawyer</button><button class="kc" data-opt>Real estate agent</button><button class="kc" data-opt>Doctor</button><button class="kc" data-opt>Psychologist or therapist</button><button class="kc" data-opt>Comedian</button><button class="kc more" data-else>+ Something else</button></div>
<div style="display:flex;flex-direction:column;gap:10px"><div style="font-size:17px;font-weight:600">My videos are for <span class="ink2" style="font-weight:400;font-size:15px">· up to 2</span></div><div data-group data-cap="2" style="display:flex;flex-wrap:wrap;gap:8px"><button class="kc on" data-opt><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg>Grow my audience</button><button class="kc" data-opt>Sell something</button><button class="kc" data-opt>Teach</button><button class="kc" data-opt>Entertain</button><button class="kc" data-opt>Win clients</button><button class="kc" data-opt>Build a community</button><button class="kc" data-opt>Raise awareness</button></div></div>
</div>
<div class="bbar"><button class="link ink2">Skip this one</button><button class="cta">Continue</button></div>
</div>
</div>
<script>
(function(){var CK='<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg>';
function mark(x){var has=x.querySelector('svg'),on=x.classList.contains('on');if(on&&!has)x.insertAdjacentHTML('afterbegin',CK);if(!on&&has)has.remove()}
document.querySelectorAll('[data-group]').forEach(function(g){var cap=+g.dataset.cap||1;g.querySelectorAll('[data-opt]').forEach(function(o){o.addEventListener('click',function(){
 if(cap===1){g.querySelectorAll('[data-opt]').forEach(function(x){x.classList.toggle('on',x===o);mark(x)})}
 else{if(!o.classList.contains('on')&&g.querySelectorAll('[data-opt].on').length>=cap)return;o.classList.toggle('on');mark(o)}
 var full=g.querySelectorAll('[data-opt].on').length>=cap&&cap>1;g.querySelectorAll('[data-opt]').forEach(function(x){x.classList.toggle('dimmed',full&&!x.classList.contains('on'))})})})});
document.querySelectorAll('.ac').forEach(function(a){a.addEventListener('click',function(){document.querySelectorAll('.ac').forEach(function(x){x.classList.toggle('on',x===a)})})})})();
</script>
</body>
</html>
