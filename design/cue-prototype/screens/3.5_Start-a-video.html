<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>Cue — Start a video</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&amp;family=Geist+Mono:wght@500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.night{background:radial-gradient(70% 30% at 20% 6%,rgba(157,140,255,0.20),rgba(157,140,255,0) 70%),#0A0B12}
.sheet{background:radial-gradient(80% 26% at 50% 0%,rgba(157,140,255,0.2),rgba(157,140,255,0) 70%),#161826}
.row{background:#1F2236;box-shadow:inset 0 0 0 0.5px rgba(180,167,255,0.14)}
</style>
<style>html,body{background:#000}</style>
</head>
<body>
<div class="night" style="width: 390px; height: 844px; position: relative; overflow: hidden; font-family: Geist, -apple-system, sans-serif; color: #fff">
  <div style="position: absolute; left: 20px; top: 54px; font-size: 34px; font-weight: 700; letter-spacing: -0.02em; opacity: 0.4">Scripts</div>
  <div style="position: absolute; inset: 0; background: rgba(0,0,0,0.5)"></div>

  <div class="sheet" style="position: absolute; left: 0; right: 0; top: 330px; bottom: 0; border-radius: 34px 34px 0 0; box-shadow: inset 0 0.5px 0 rgba(180,167,255,0.3)">
    <div style="position: absolute; left: 50%; top: 8px; width: 36px; height: 5px; border-radius: 3px; background: rgba(225,228,245,0.3); transform: translateX(-50%)"></div>
    <div style="position: absolute; left: 20px; right: 16px; top: 26px; display: flex; align-items: center; justify-content: space-between">
      <div style="font-size: 24px; font-weight: 700; letter-spacing: -0.02em">Start a video</div>
      <button aria-label="Close" style="width: 32px; height: 32px; border-radius: 16px; border: 0; background: #2A2C40; display: flex; align-items: center; justify-content: center; padding: 0"><svg width="11" height="11" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="rgba(225,228,245,0.8)" stroke-width="3.40" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"></path></svg></button>
    </div>
    <div style="position: absolute; left: 16px; right: 16px; top: 76px; display: flex; flex-direction: column; gap: 8px">
      <button style="height: 66px; border-radius: 20px; border: 0; background: radial-gradient(90% 140% at 0% 0%,rgba(157,140,255,0.5),rgba(157,140,255,0) 70%),#1E1B45; box-shadow: inset 0 0 0 0.5px rgba(180,167,255,0.4); color: #fff; display: flex; align-items: center; gap: 14px; padding: 0 14px; text-align: left; font-family: inherit">
        <span style="width: 40px; height: 40px; border-radius: 13px; background: rgba(157,140,255,0.25); display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#E4DEFF" stroke-width="1.5" stroke-linejoin="round"><path d="M12 3C12.8 8.5 15.5 11.2 21 12C15.5 12.8 12.8 15.5 12 21C11.2 15.5 8.5 12.8 3 12C8.5 11.2 11.2 8.5 12 3Z"></path></svg></span>
        <span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 16px; font-weight: 600">Let Cue write it</span><span style="font-size: 13px; color: #CFC6FF">Say or type an idea · in your voice</span></span>
      </button>
      <button class="row" style="height: 62px; border-radius: 20px; border: 0; color: #fff; display: flex; align-items: center; gap: 14px; padding: 0 14px; text-align: left; font-family: inherit">
        <span style="width: 40px; height: 40px; border-radius: 13px; background: rgba(255,255,255,0.07); display: flex; align-items: center; justify-content: center"><svg width="19" height="19" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="#fff" stroke-width="2.02" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 19.5h4l10-10a2.8 2.8 0 0 0-4-4l-10 10z"></path><path d="M13 7l4 4"></path></svg></span>
        <span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 16px; font-weight: 600">Write it myself</span><span style="font-size: 13px; color: rgba(225,228,245,0.6)">Start with your own words</span></span>
      </button>
      <button class="row" style="height: 62px; border-radius: 20px; border: 0; color: #fff; display: flex; align-items: center; gap: 14px; padding: 0 14px; text-align: left; font-family: inherit">
        <span style="width: 40px; height: 40px; border-radius: 13px; background: rgba(255,255,255,0.07); display: flex; align-items: center; justify-content: center"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8V5a1 1 0 011-1h3M16 4h3a1 1 0 011 1v3M20 16v3a1 1 0 01-1 1h-3M8 20H5a1 1 0 01-1-1v-3"></path><path d="M8 10h8M8 14h5"></path></svg></span>
        <span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 16px; font-weight: 600">Import text</span><span style="font-size: 13px; color: rgba(225,228,245,0.6)">Scan, photo, file or paste</span></span>
      </button>
      <button class="row" style="height: 62px; border-radius: 20px; border: 0; color: #fff; display: flex; align-items: center; gap: 14px; padding: 0 14px; text-align: left; font-family: inherit">
        <span style="width: 40px; height: 40px; border-radius: 13px; background: rgba(255,214,10,0.12); display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="#fff" stroke-width="1.92" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4.5h14a1.5 1.5 0 0 1 1.5 1.5v9a1.5 1.5 0 0 1-1.5 1.5h-7l-4.5 3.5v-3.5H5A1.5 1.5 0 0 1 3.5 15V6A1.5 1.5 0 0 1 5 4.5z"></path><path d="M10.5 8v5.6l4.4-2.8z" fill="#fff" stroke="none"></path></svg></span>
        <span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 16px; font-weight: 600; display: flex; align-items: center; gap: 8px">Answer a comment<span style="height: 18px; padding: 0 6px; border-radius: 9px; background: rgba(255,214,10,0.16); color: #FFD60A; font-family: 'Geist Mono', monospace; font-size: 9.5px; font-weight: 600; display: flex; align-items: center">NEW</span></span><span style="font-size: 13px; color: rgba(225,228,245,0.6)">Turn a question from your audience into a script</span></span>
      </button>
      <button style="height: 50px; border: 0; background: transparent; color: rgba(225,228,245,0.8); display: flex; align-items: center; justify-content: center; gap: 8px; font-family: inherit; font-size: 15px; font-weight: 600"><span style="width: 9px; height: 9px; border-radius: 5px; background: #FF3B30; box-shadow: 0 0 8px rgba(255,59,48,0.8)"></span>Record without a script</button>
    </div>
  </div>
</div>
</body>
</html>
