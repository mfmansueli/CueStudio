<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=390">

<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@500&amp;display=swap" rel="stylesheet">
<style>
/* 5.2 Prompter Selfie · v31.

:root{--acc:#FFD60A;--record:#FF3B30;--info:#64D2FF;--success:#30D158;--ink2:rgba(225,228,245,.62);--inkHint:rgba(225,228,245,.55)}
body{margin:0;background:#000}*{box-sizing:border-box}
.phone{width:390px;height:844px;position:relative;overflow:hidden;font-family:-apple-system,"SF Pro Text",system-ui,sans-serif;color:#fff}
.mono{font-family:ui-monospace,"SF Mono",Menlo,monospace}
.glass{background:linear-gradient(180deg,rgba(255,255,255,.16),rgba(255,255,255,.06));box-shadow:inset 0 0 0 .5px rgba(255,255,255,.22);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
.cb{width:47px;height:47px;border-radius:24px;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:linear-gradient(180deg,rgba(255,255,255,.12),rgba(255,255,255,.05));box-shadow:inset 0 0 0 .5px rgba(255,255,255,.22),inset 0 1px 0 rgba(255,255,255,.14)}
.lx{font-family:Lexend,-apple-system,sans-serif;font-weight:500;text-align:center;white-space:nowrap}
.sheet{position:absolute;left:11px;right:11px;bottom:27px;border-radius:44px;background:rgba(40,40,46,.94);box-shadow:inset 0 0 0 .5px rgba(255,255,255,.14),0 -1px 0 rgba(255,255,255,.04);z-index:6;transition:top .32s cubic-bezier(.2,.8,.2,1)}
.x{display:none}.open .x{display:flex}.open .xc{display:none}
svg{display:block}
</style></head><body>

</div>

<div style="position:absolute;left:150px;top:600px;width:190px;height:170px;border-radius:50% 50% 0 0;background:#2a221d;filter:blur(2px)"></div>

<div style="position:absolute;left:35px;top:122px;width:322px;height:371px;border-radius:24px;background:rgba(120,116,112,.32);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:inset 0 0 0 .5px rgba(255,255,255,.12);overflow:hidden;z-index:2">
  <div style="position:absolute;left:0;right:0;top:-8px;-webkit-mask-image:linear-gradient(180deg,#000 0,#000 78%,transparent 100%);mask-image:linear-gradient(180deg,#000 0,#000 78%,transparent 100%)">
    <div class="lx" style="font-size:25px;line-height:50px;text-shadow:0 1px 2px rgba(0,0,0,.35)">A small error in planning</div>
    <div class="lx" style="font-size:25px;line-height:50px;text-shadow:0 1px 2px rgba(0,0,0,.35)">can turn a weekend Into</div>

    <div class="lx" style="font-size:25px;line-height:50px;text-shadow:0 1px 2px rgba(0,0,0,.35)">I’ve seen how tight</div>

    <div class="lx" style="font-size:25px;line-height:50px;text-shadow:0 1px 2px rgba(0,0,0,.35)">guesses. When I first</div>
    <div class="lx" style="font-size:25px;line-height:50px;text-shadow:0 1px 2px rgba(0,0,0,.35)">tried to make my cash</div>
    <div class="lx" style="font-size:25px;line-height:50px;text-shadow:0 1px 2px rgba(0,0,0,.35)">last, I stuck to boring</div>
  </div>
</div>
<!-- Resize corner (yellow) -->

<div style="position:absolute;left:27px;width:336px;top:137px;height:2px;background:var(--acc);box-shadow:0 0 6px rgba(255,214,10,.45);z-index:3"></div>
<div style="position:absolute;left:340px;top:134px;width:8px;height:8px;border-radius:4px;background:var(--acc);z-index:3"></div>

<div role="button" aria-label="Reading line" style="position:absolute;left:364px;top:123px;width:14px;height:33px;border-radius:7px;background:rgba(72,72,76,.88);box-shadow:inset 0 0 0 .5px rgba(255,255,255,.28);display:flex;align-items:center;justify-content:center;z-index:3"><svg width="7" height="12" viewBox="0 0 7 12" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M1 4.2L3.5 1.6 6 4.2M1 7.8l2.5 2.6L6 7.8"/></svg></div>

<!-- SelfieControlPanel (ControlSheet). Folded: handle · HUD · capture row. Open adds scroll mode row + tip. -->
<div class="sheet" id="sh">
  <div role="button" aria-label="Controls" data-tool="sheet" onclick="document.getElementById('ph').classList.toggle('open')" style="height:36px;display:flex;align-items:center;justify-content:center;color:var(--ink2);cursor:pointer"><svg class="xc" width="13" height="8" viewBox="0 0 13 8" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 6.5L6.5 1.5l5 5"/></svg><svg class="x" width="13" height="8" viewBox="0 0 13 8" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 1.5l5 5 5-5"/></svg></div>
  <div class="x" style="flex-direction:column;gap:20px;margin-top:-6px;margin-bottom:22px">
    <div style="display:flex;align-items:center;gap:6px;padding:0 11px">

      <span style="height:38px;padding:0 8px 0 6px;display:flex;align-items:center;gap:6px;font-size:15px;font-weight:600;color:var(--ink2)"><svg width="17" height="14" viewBox="0 0 24 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M8 5h14M8 10h14M8 15h14M2 19h20"/><path d="M1.5 1.5l3 2-3 2z" fill="currentColor" stroke="none"/></svg>Steady</span></div>
      <span class="cb" aria-label="Back to start" style="margin-left:auto"><svg width="20" height="22" viewBox="0 0 20 22" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 2h14M10 20V7M5 11.5l5-5 5 5"/></svg></span>
      <span class="cb" aria-label="Play"><svg width="17" height="18" viewBox="0 0 17 18" fill="#fff"><path d="M2 1.5v15l13-7.5z"/></svg></span>
      <span class="cb" aria-label="Text" style="font-size:18px;font-weight:600">Aa</span>
    </div>
    <div style="display:flex;align-items:center;gap:10px;padding:0 21px;font-size:12.5px;color:var(--ink2);white-space:nowrap;overflow:hidden"><span style="display:flex;gap:3px"><i style="width:4px;height:4px;border-radius:2px;background:var(--acc)"></i><i style="width:4px;height:4px;border-radius:2px;background:var(--acc)"></i><i style="width:4px;height:4px;border-radius:2px;background:var(--acc)"></i><i style="width:4px;height:4px;border-radius:2px;background:var(--acc)"></i><i style="width:4px;height:4px;border-radius:2px;background:var(--acc)"></i></span>Scrolls when you talk, waits when you stop.</div>
  </div>
  <div class="mono" style="margin-top:2px;height:28px;display:flex;align-items:center;justify-content:center;gap:7px;font-size:13px;font-weight:600;letter-spacing:.5px"><span style="width:7px;height:7px;border-radius:4px;background:var(--success)"></span>IPHONE <span style="color:var(--inkHint)">·</span> 1080P <span style="color:var(--inkHint)">·</span> 9:16 <svg width="6" height="9" viewBox="0 0 6 9" fill="none" stroke="var(--ink2)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 1.2L4.8 4.5 1.5 7.8"/></svg></div>
  <div style="display:flex;align-items:center;justify-content:space-between;padding:12px 18px 0 17px">
    <span aria-label="Last take" style="width:44px;height:44px;border-radius:12px;background:rgba(255,255,255,.07);box-shadow:inset 0 0 0 .5px rgba(255,255,255,.1)"></span>
    <span class="cb" aria-label="Recording settings"><svg width="21" height="19" viewBox="0 0 24 22" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round"><path d="M2 4h13M20 4h2M2 11h4M11 11h11M2 18h11M18 18h4"/><circle cx="17.5" cy="4" r="2.4"/><circle cx="8.5" cy="11" r="2.4"/><circle cx="15.5" cy="18" r="2.4"/></svg></span>
    <span role="button" aria-label="Record" style="width:78px;height:78px;border-radius:39px;border:4px solid #fff;cursor:pointer;display:flex;align-items:center;justify-content:center"><span style="width:62px;height:62px;border-radius:31px;background:var(--record)"></span></span>
    <span class="cb" aria-label="Flip camera" style="width:49px;height:49px;border-radius:25px"><svg width="22" height="19" viewBox="0 0 24 20" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6.5A2.5 2.5 0 0 1 5.5 4h2l1.5-2h6l1.5 2h2A2.5 2.5 0 0 1 21 6.5v9a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 15.5z"/><path d="M8.2 10.2a3.9 3.9 0 0 1 6.9-1.6M15.8 11.8a3.9 3.9 0 0 1-6.9 1.6"/><path d="M15.6 6.6v2.3h-2.3M8.4 15.4v-2.3h2.3"/></svg></span>
    <span class="cb" aria-label="More" style="width:48px;height:48px;position:relative"><span style="display:flex;gap:4px"><i style="width:5px;height:5px;border-radius:3px;background:#fff"></i><i style="width:5px;height:5px;border-radius:3px;background:#fff"></i><i style="width:5px;height:5px;border-radius:3px;background:#fff"></i></span><i class="mono" style="position:absolute;right:-9px;top:-8px;height:17px;padding:0 5px;border-radius:9px;background:var(--acc);color:#000;font-size:11px;font-weight:700;line-height:17px;font-style:normal">3s</i></span>
  </div>
</div>
</div>
