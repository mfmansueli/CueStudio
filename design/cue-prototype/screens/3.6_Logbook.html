<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Cue — Logbook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&amp;family=Geist+Mono:wght@500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.night{background:radial-gradient(70% 30% at 20% 6%,rgba(157,140,255,0.20),rgba(157,140,255,0) 70%),#0A0B12}
.sheet{background:radial-gradient(70% 22% at 50% 0%,rgba(157,140,255,0.16),rgba(157,140,255,0) 70%),rgba(18,20,34,0.97)}
@keyframes ring{0%{transform:scale(1);opacity:0.55}100%{transform:scale(1.5);opacity:0}}
.ring{animation:ring 2.4s ease-out infinite}
@media (prefers-reduced-motion: reduce){.ring{animation:none;opacity:0.3}}
.mint{background:radial-gradient(circle at 34% 30%,#E6FFF5 0%,#7EE0B8 40%,#23735C 85%,#0E2A22 100%)}
.warm{background:radial-gradient(circle at 34% 30%,#FFF0CC 0%,#FFC46B 32%,#C9742F 70%,#3A1E10 100%)}
</style>
<style>html,body{background:#000}</style>
</head>
<body>

      <div style="border-radius: 16px; background: #1F2236; padding: 12px 14px; display: flex; align-items: center; gap: 12px">

      </div>

          <svg width="10" height="14" viewBox="3.428571428571429 0 17.142857142857142 24" aria-hidden="true" fill="none" stroke="#FFD60A" stroke-width="2.74" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v3"></path></svg>

        </div>
        <button style="height: 30px; padding: 0 11px; border-radius: 15px; border: 0.5px solid rgba(180,167,255,0.36); background: rgba(157,140,255,0.16); color: #E4DEFF; font-family: Geist, sans-serif; font-size: 13px; font-weight: 600; white-space: nowrap"><span style="color: #B4A7FF">✦</span> Write</button>
      </div>
      <div style="border-radius: 16px; background: #1F2236; padding: 12px 14px; display: flex; align-items: center; gap: 12px">
        <div style="width: 32px; height: 32px; flex-shrink: 0; border-radius: 16px; background: rgba(110,116,150,0.26); display: flex; align-items: center; justify-content: center">
          <svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="rgba(225,228,245,0.8)" stroke-width="2.74" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 19.5h4l10-10a2.8 2.8 0 0 0-4-4l-10 10z"></path><path d="M13 7l4 4"></path></svg>
        </div>
