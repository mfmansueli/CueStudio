<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<title>Cue — Your topics</title>
<style>
/* 1.2 Chapter 1, read from source (879bee2e468a): UniverseChapter (heading, universe canvas 120–300 pt, counter + chips with 6 pt spacing, Continue that reads
   "Pick a topic" in grey until one is picked), OnboardingParts (5-segment bar 22 × 4, heading: HUD label in yellow, title 30 bold −0.6, line 15 ink2; yellow
   pill 54 pt), OnboardingTopicChip (32 pt, 12.5 semibold, picked = white with a 3 × 14 bar of its world's colour), TopicCounter (three 3 × 16 bars, 12 mono
   semibold, tracking 1.2, gold at three), Niche.offered + chipLabel, OnboardingTopic (limit 3, colours warm · mint · pink), OnboardingStep.chapterLabel.
   Approximate (not read): the universe drawing (OnboardingUniverseCanvas, TopicBirth), the opening clip (screens-motion.json 1.2_topics). */
body{margin:0;background:#000}*{box-sizing:border-box}
.phone{width:390px;height:844px;position:relative;overflow:hidden;font-family:-apple-system,"SF Pro Text",system-ui,sans-serif;color:#fff;background:#07080E;display:flex;flex-direction:column;padding:54px 0 34px}
.mono{font-family:ui-monospace,"SF Mono",Menlo,monospace}
.chip{height:32px;padding:0 11px;border-radius:16px;display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;background:rgba(110,116,150,.26);color:rgba(225,228,245,.62);white-space:nowrap;cursor:pointer;transition:background .16s ease-out,color .16s ease-out,opacity .2s}
.chip.on{background:#fff;color:#000;padding:0 10px 0 8px}
.chip .bar{width:3px;height:14px;border-radius:1.5px;display:none}
.chip.on .bar{display:block;animation:pop .25s cubic-bezier(.3,1.5,.5,1) .05s both}
.chip.dim{opacity:.4}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
@keyframes orbit{to{transform:rotate(360deg)}}
@keyframes rise{from{opacity:0;transform:translateY(16px);filter:blur(10px)}to{opacity:1;transform:none;filter:none}}
.rise{animation:rise .75s cubic-bezier(.16,1,.3,1) both}
@media (prefers-reduced-motion:reduce){.rise,.orb{animation:none!important}}
</style></head><body>
<div class="phone">
  <div style="position:absolute;inset:0;background:radial-gradient(60% 30% at 50% 40%,rgba(157,140,255,.14),rgba(157,140,255,0) 70%);pointer-events:none"></div>
  <!-- OnboardingChrome -->
  <div style="margin-top:8px;height:44px;padding:0 20px;display:flex;align-items:center;gap:5px;flex-shrink:0">
    <span style="width:22px;height:4px;border-radius:2px;background:#FFD60A"></span><span style="width:22px;height:4px;border-radius:2px;background:rgba(110,116,150,.26)"></span><span style="width:22px;height:4px;border-radius:2px;background:rgba(110,116,150,.26)"></span><span style="width:22px;height:4px;border-radius:2px;background:rgba(110,116,150,.26)"></span><span style="width:22px;height:4px;border-radius:2px;background:rgba(110,116,150,.26)"></span>
  </div>
  <div style="padding:0 20px;display:flex;flex-direction:column;gap:10px;flex-shrink:0">
    <div class="mono rise" style="font-size:12px;font-weight:600;letter-spacing:1.4px;color:#FFD60A">CHAPTER 1 · YOUR TOPICS</div>
    <div class="rise" style="font-size:30px;line-height:36px;font-weight:700;letter-spacing:-.6px;animation-delay:.08s">What do you usually talk about?</div>
    <div class="rise" style="font-size:15px;line-height:20px;color:rgba(225,228,245,.62);animation-delay:.16s">Pick up to 3. Cue uses them for your video ideas, and each one becomes a world.</div>
  </div>
  <!-- Your universe: YOU in the middle, each topic a world on its orbit (≈ drawing) -->
  <div aria-label="Your universe" style="flex:1;min-height:120px;max-height:300px;position:relative">
    <div id="uni" style="position:absolute;left:50%;top:50%;width:0;height:0">
      <div style="position:absolute;left:-150px;top:-46px;width:300px;height:92px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(180,167,255,.16)"></div>
      <div style="position:absolute;left:-110px;top:-34px;width:220px;height:68px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(180,167,255,.16)"></div>
      <div style="position:absolute;left:-70px;top:-22px;width:140px;height:44px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(180,167,255,.16)"></div>
      <div style="position:absolute;left:-13px;top:-13px;width:26px;height:26px;border-radius:13px;background:radial-gradient(circle at 40% 38%,#fff 0,#F2EEFF 45%,#C9BFFF 100%);box-shadow:0 0 22px rgba(201,191,255,.7)"></div>
      <div class="mono" style="position:absolute;left:-20px;top:16px;width:40px;text-align:center;font-size:9px;font-weight:700;letter-spacing:1px;color:rgba(228,222,255,.8)">YOU</div>
    </div>
  </div>
  <div style="padding:0 20px;display:flex;flex-direction:column;gap:8px;flex-shrink:0">
    <div style="display:flex;align-items:center;gap:9px;min-height:18px">
      <span id="bars" style="display:flex;gap:3px"></span>
      <span id="count" class="mono" style="font-size:12px;font-weight:600;letter-spacing:1.2px;color:rgba(255,255,255,.82)">PICK 1 TO 3 TOPICS</span>
    </div>
    <div id="chips" style="display:flex;flex-wrap:wrap;gap:12px 6px"></div>
  </div>
  <div style="flex:0 0 12px"></div>
  <div style="padding:0 20px 8px;flex-shrink:0">
    <div id="go" role="button" data-tool="off" style="height:54px;border-radius:27px;background:rgba(110,116,150,.26);color:rgba(225,228,245,.45);font-size:17px;font-weight:700;display:flex;align-items:center;justify-content:center;cursor:pointer">Pick a topic</div>
  </div>
</div>
<script>
(function(){function f(){document.body.style.zoom=Math.min(1,(innerHeight-8)/860)}f();addEventListener('resize',f)})();
(function(){
  var TOP=['Fitness & wellness','Food & cooking','Beauty & skincare','Fashion & style','Personal finance','Tech & AI','Budget travel','Productivity & career','Parenting & family','Daily routines'];
  var COL=['#FFC46B','#7EE0B8','#FF9BD2'],R=[[70,22],[110,34],[150,46]],picked=[];
  var chips=document.getElementById('chips'),bars=document.getElementById('bars'),count=document.getElementById('count'),go=document.getElementById('go'),uni=document.getElementById('uni');
  var els=TOP.map(function(t){var c=document.createElement('span');c.className='chip';c.setAttribute('data-tool','topic');c.innerHTML='<span class="bar"></span>'+t.replace(/&/g,'&amp;');chips.appendChild(c);c.addEventListener('click',function(){tap(t)});return c;});
  var own=document.createElement('span');own.className='chip';own.textContent='+ Your own';own.style.cssText='background:transparent;box-shadow:none;outline:1px dashed rgba(225,228,245,.45);outline-offset:-1px';chips.appendChild(own);
  for(var i=0;i<3;i++){var b=document.createElement('span');b.style.cssText='width:3px;height:16px;border-radius:1.5px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.4);transition:transform .45s cubic-bezier(.3,1.5,.5,1)';bars.appendChild(b);}
  function tap(t){var i=picked.indexOf(t);if(i>=0)picked.splice(i,1);else{if(picked.length>=3)return;picked.push(t);}draw();}
  function draw(){var n=picked.length,full=n>=3;
    els.forEach(function(c,k){var j=picked.indexOf(TOP[k]);c.classList.toggle('on',j>=0);c.classList.toggle('dim',full&&j<0);c.querySelector('.bar').style.background=j>=0?COL[j]:'';c.querySelector('.bar').style.boxShadow=j>=0?'0 0 8px '+COL[j]+'99':'';});
    own.style.opacity=full?.4:1;
    [].forEach.call(bars.children,function(b,k){b.style.background=k<n?COL[k]:'transparent';b.style.boxShadow=k<n?'0 0 8px '+COL[k]+'99':'inset 0 0 0 1px rgba(255,255,255,.4)';});
    count.textContent=n===0?'PICK 1 TO 3 TOPICS':n===1?'1 OF 3 · ADD MORE OR CONTINUE':n===3?'3 OF 3 · TAP ONE TO SWAP':n+' OF 3 · ADD ONE MORE OR CONTINUE';count.style.color=full?'#FFE680':'rgba(255,255,255,.82)';
    if(n){go.textContent='Continue';go.style.background='#FFD60A';go.style.color='#000';go.removeAttribute('data-tool');}else{go.textContent='Pick a topic';go.style.background='rgba(110,116,150,.26)';go.style.color='rgba(225,228,245,.45)';go.setAttribute('data-tool','off');}
    [].slice.call(uni.querySelectorAll('.orb')).forEach(function(o){o.remove()});
    picked.forEach(function(t,k){var o=document.createElement('div');o.className='orb';o.style.cssText='position:absolute;left:0;top:0;width:0;height:0;transform:scaleY('+(R[k][1]/R[k][0])+')';var spin=document.createElement('div');spin.className='orb';spin.style.cssText='position:absolute;left:0;top:0;width:0;height:0;animation:orbit '+(18+k*8)+'s linear infinite;animation-delay:-'+(k*5)+'s';var p=document.createElement('div');p.style.cssText='position:absolute;left:'+(R[k][0]-7)+'px;top:-7px;width:14px;height:14px;border-radius:7px;background:radial-gradient(circle at 35% 30%,#fff,'+COL[k]+' 55%,rgba(0,0,0,.35));box-shadow:0 0 12px '+COL[k];spin.appendChild(p);o.appendChild(spin);uni.appendChild(o);});
  }
  draw();
})();
</script>
</body></html>
