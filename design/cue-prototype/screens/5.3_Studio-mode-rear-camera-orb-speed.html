<style>
/* 5.3 Prompter Studio · v31.

   Calibrated against IMG_7437 / IMG_7438 (points = px ÷ 3): progress track y 124 (3 pt), time line y 139, reading line y 275 with glow under it,
   right scrubber x 379 from 169 to 547 with yellow head, Lexend 500 34 pt, pitch 68 (2.0), text starts on the reading line.

:root{--acc:#FFD60A;--record:#FF3B30;--info:#64D2FF;--success:#30D158;--ink2:rgba(225,228,245,.62);--inkHint:rgba(225,228,245,.55)}

.phone{width:390px;height:844px;position:relative;overflow:hidden;font-family:-apple-system,"SF Pro Text",system-ui,sans-serif;color:#fff}

.glass{background:linear-gradient(180deg,rgba(255,255,255,.16),rgba(255,255,255,.06));box-shadow:inset 0 0 0 .5px rgba(255,255,255,.22);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}

.sheet{position:absolute;left:11px;right:11px;bottom:27px;border-radius:44px;background:rgba(40,40,46,.94);box-shadow:inset 0 0 0 .5px rgba(255,255,255,.14),0 -1px 0 rgba(255,255,255,.04);z-index:6;transition:top .32s cubic-bezier(.2,.8,.2,1)}
.x{display:none}.open .x{display:flex}.open .xc{display:none}
svg{display:block}
