<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<title>Cue — Prompter selfie</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&amp;family=Geist+Mono:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
/* Tokens: Palette.swift, Metrics.swift. Structure: SelfieModeView, SelfieTopBar, SelfieControlParts, RecordButton (879bee2e468a). */
:root{--acc:#FFD60A;--accInk:#000;--record:#FF3B30;--info:#64D2FF;--ink2:rgba(225,228,245,.62);--inkHint:rgba(225,228,245,.55);--success:#30D158}
body{margin:0;background:#000}*{box-sizing:border-box}
.phone{width:390px;height:844px;position:relative;overflow:hidden;font-family:Geist,-apple-system,sans-serif;color:#fff}
.mono{font-family:'Geist Mono',ui-monospace,monospace}
.glass{background:linear-gradient(180deg,rgba(255,255,255,.16),rgba(255,255,255,.06));box-shadow:inset 0 0 0 .5px rgba(255,255,255,.2);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
.circ{width:52px;height:52px;border-radius:26px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.line{font-size:32px;line-height:50px;font-weight:700;letter-spacing:-.01em;text-align:center;text-shadow:0 2px 14px rgba(0,0,0,.55)}
svg{display:block}
</style></head><body>
<div class="phone" style="background:linear-gradient(180deg,#8d8178,#5e5149 60%,#3b312b)">
<!-- Navigation bar (system): close, Selfie | Studio (ModeSwitcher, segmented), platform chip ("● TikTok") -->
<div style="position:absolute;left:20px;right:20px;top:56px;height:52px;display:flex;align-items:center;justify-content:space-between;z-index:3">
  <div class="glass circ" data-sf="xmark"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><path d="M5 5l14 14M19 5L5 19"/></svg></div>
  <div class="glass" style="height:52px;padding:4px;border-radius:26px;display:flex;background:rgba(14,16,28,.6)"><span style="height:44px;padding:0 20px;border-radius:22px;display:flex;align-items:center;background:rgba(14,16,28,.9);font-size:17px;font-weight:600">Selfie</span><span style="height:44px;padding:0 20px;border-radius:22px;display:flex;align-items:center;font-size:17px;font-weight:600;opacity:.85">Studio</span></div>
  <div class="glass" style="height:52px;padding:0 16px;border-radius:26px;display:flex;align-items:center;gap:8px;font-size:17px;font-weight:600"><span class="mono" style="width:9px;height:9px;border-radius:5px;background:var(--info)"></span>TikTok</div>
</div>
<!-- Reading meter: "1:23 LEFT" yellow, ideal range grey; progress 3 pt -->
<div style="position:absolute;left:20px;right:20px;top:136px;display:flex;justify-content:space-between;z-index:3"><span class="mono" style="font-size:16px;font-weight:600;color:var(--acc);letter-spacing:.06em">1:23 LEFT</span><span class="mono" style="font-size:16px;color:rgba(225,228,245,.65);letter-spacing:.04em">1:23 · IDEAL 1:00–1:30</span></div>
<div style="position:absolute;left:20px;right:20px;top:166px;height:3px;border-radius:2px;background:rgba(14,16,28,.6);z-index:3"><div style="width:30%;height:3px;border-radius:2px;background:var(--acc)"></div></div>
<!-- Reading line (ReadingLineLayer) and TikTok safe area (SafeZoneOverlay) -->
<div style="position:absolute;left:0;right:0;top:250px;height:2px;background:linear-gradient(90deg,rgba(255,214,10,0),var(--acc) 8%,var(--acc) 92%,rgba(255,214,10,0));z-index:2"></div>
<div style="position:absolute;left:24px;top:330px;width:342px;height:440px;border:1.5px dashed rgba(255,255,255,.7);border-radius:6px;z-index:1"></div>
<div class="mono" style="position:absolute;left:44px;top:700px;font-size:12px;font-weight:600;letter-spacing:.12em;color:rgba(255,255,255,.75);z-index:2">TIKTOK SAFE AREA</div>
<!-- Text window: PrompterTextView, 34 pt bold, centred, fades toward the bottom -->
<div style="position:absolute;left:0;right:0;top:300px;padding:0 24px;z-index:2">
  <div class="line">A small error in planning can turn a weekend Into this week-long mess.</div>
  <div class="line" style="opacity:.6">I’ve seen how tight money hides quiet guesses.</div>
  <div class="line" style="opacity:.25">When I first tried to make my cash last.</div>
</div>
<!-- Control panel (SelfieControlPanel): hint, IPHONE · 1080P · 9:16, record ring (RecordButton 78 pt, white ring, red 62 pt), flip, more with 3s badge -->
<div class="glass" style="position:absolute;left:16px;right:16px;bottom:30px;height:280px;border-radius:40px;background:rgba(40,40,46,.82);z-index:4;padding:16px">
  <div style="text-align:center;color:rgba(225,228,245,.6);font-size:20px">⌃</div>
  <div class="mono" style="position:absolute;left:0;right:0;bottom:116px;text-align:center;font-size:14px;font-weight:600;letter-spacing:.06em"><span style="display:inline-block;width:8px;height:8px;border-radius:4px;background:var(--success);margin-right:8px"></span>IPHONE · 1080P · 9:16 <span style="color:rgba(225,228,245,.5)">›</span></div>
  <div style="position:absolute;left:22px;right:22px;bottom:24px;display:flex;align-items:center;justify-content:space-between">
    <span style="width:64px;height:64px;border-radius:18px;background:rgba(110,116,150,.2)"></span>
    <span class="circ" style="width:56px;height:56px;background:rgba(255,255,255,.14)" data-sf="slider.horizontal.3"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg></span>
    <span style="width:78px;height:78px;border-radius:39px;border:4px solid #fff;display:flex;align-items:center;justify-content:center"><span style="width:62px;height:62px;border-radius:31px;background:var(--record)"></span></span>
    <span class="circ" style="width:56px;height:56px;background:rgba(255,255,255,.14)" data-sf="arrow.triangle.2.circlepath.camera"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round"><path d="M4.95 9.43A7.5 7.5 0 0 1 19.05 9.43M19.05 14.57A7.5 7.5 0 0 1 4.95 14.57"/></svg></span>
    <span class="circ" style="width:56px;height:56px;background:rgba(255,255,255,.14);position:relative" data-sf="ellipsis"><span style="display:flex;gap:3px"><i style="width:4px;height:4px;border-radius:2px;background:#fff"></i><i style="width:4px;height:4px;border-radius:2px;background:#fff"></i><i style="width:4px;height:4px;border-radius:2px;background:#fff"></i></span><i class="mono" style="position:absolute;right:-8px;top:-8px;height:24px;padding:0 7px;border-radius:12px;background:var(--acc);color:#000;font-size:12px;font-weight:700;line-height:24px;font-style:normal">3s</i></span>
  </div>
</div>
</div>
<script>(function(){function f(){document.body.style.zoom=Math.min(1,(innerHeight-8)/860)}f();addEventListener('resize',f)})();</script>
</body></html>
