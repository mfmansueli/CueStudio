<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Cue — Scripts by platform, theme as color</title>

<style>
body{margin:0}
.night{background:radial-gradient(70% 30% at 20% 6%,rgba(157,140,255,0.20),rgba(157,140,255,0) 70%),radial-gradient(55% 28% at 85% 60%,rgba(94,78,224,0.12),rgba(94,78,224,0) 70%),#0A0B12}
.stars{background-image:radial-gradient(1.3px 1.3px at 22px 38px,rgba(255,255,255,0.75),transparent),radial-gradient(1px 1px at 88px 142px,rgba(228,222,255,0.6),transparent),radial-gradient(1.6px 1.6px at 151px 64px,rgba(255,255,255,0.55),transparent),radial-gradient(1px 1px at 203px 211px,rgba(255,255,255,0.45),transparent),radial-gradient(1.2px 1.2px at 262px 30px,rgba(228,222,255,0.7),transparent),radial-gradient(1px 1px at 318px 168px,rgba(255,255,255,0.5),transparent),radial-gradient(1.4px 1.4px at 360px 92px,rgba(255,236,170,0.55),transparent),radial-gradient(1px 1px at 45px 250px,rgba(255,255,255,0.4),transparent),radial-gradient(1px 1px at 128px 290px,rgba(228,222,255,0.45),transparent),radial-gradient(1.2px 1.2px at 290px 268px,rgba(255,255,255,0.5),transparent);background-size:390px 310px;animation:drift 160s linear infinite}
@keyframes drift{from{background-position:0 0}to{background-position:0 310px}}
@keyframes scan{0%,100%{top:22%}50%{top:78%}}
.scan{animation:scan 6s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){.stars,.scan{animation:none}}
.hero{background:radial-gradient(90% 120% at 0% 0%,rgba(157,140,255,0.55),rgba(157,140,255,0) 60%),radial-gradient(80% 100% at 100% 100%,rgba(94,78,224,0.6),rgba(94,78,224,0) 65%),#1A1840}
.tw{position:absolute;border-radius:50%;background:#fff;box-shadow:0 0 6px 1px rgba(255,255,255,0.75);animation:twinkle 3.2s ease-in-out infinite}@keyframes twinkle{0%,100%{opacity:0.2;transform:scale(0.7)}12%{opacity:1;transform:scale(1.25)}22%{opacity:0.45;transform:scale(0.85)}38%{opacity:0.95;transform:scale(1.1)}55%{opacity:0.25;transform:scale(0.75)}72%{opacity:1;transform:scale(1.3)}86%{opacity:0.5;transform:scale(0.9)}}.tw.x::before{content:'';position:absolute;left:50%;top:50%;width:16px;height:1px;transform:translate(-50%,-50%);background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,0.9),rgba(255,255,255,0))}.tw.x::after{content:'';position:absolute;left:50%;top:50%;width:1px;height:16px;transform:translate(-50%,-50%);background:linear-gradient(rgba(255,255,255,0),rgba(255,255,255,0.9),rgba(255,255,255,0))}.shoot{position:absolute;width:130px;height:1.5px;border-radius:1px;background:linear-gradient(90deg,rgba(255,255,255,0),rgba(228,222,255,0.55) 60%,#fff);box-shadow:0 0 8px rgba(255,255,255,0.55);transform-origin:100% 50%;opacity:0;animation:shoot 11s linear infinite}@keyframes shoot{0%{opacity:0;transform:rotate(160deg) translateX(-60px)}1%{opacity:1}6%{opacity:0;transform:rotate(160deg) translateX(320px)}100%{opacity:0;transform:rotate(160deg) translateX(320px)}}@media (prefers-reduced-motion: reduce){.tw,.shoot{animation:none}.shoot{display:none}}
/*sky3*/.sky{position:absolute;inset:0;overflow:hidden;pointer-events:none}.l1,.l2,.l3{position:absolute;left:0;top:0;width:100%;height:100%}.l1{background-image:radial-gradient(0.9px 0.9px at 115px 143px,rgba(255,255,255,0.57),transparent),radial-gradient(0.9px 0.9px at 115px 130px,rgba(228,222,255,0.37),transparent),radial-gradient(0.9px 0.9px at 131px 121px,rgba(255,255,255,0.58),transparent),radial-gradient(0.7px 0.7px at 24px 114px,rgba(255,236,170,0.33),transparent),radial-gradient(0.6px 0.6px at 177px 162px,rgba(255,255,255,0.64),transparent),radial-gradient(0.9px 0.9px at 115px 167px,rgba(228,222,255,0.53),transparent),radial-gradient(0.9px 0.9px at 159px 3px,rgba(255,255,255,0.32),transparent),radial-gradient(1.0px 1.0px at 9px 48px,rgba(255,236,170,0.51),transparent),radial-gradient(0.8px 0.8px at 118px 83px,rgba(255,255,255,0.59),transparent),radial-gradient(0.9px 0.9px at 132px 59px,rgba(228,222,255,0.47),transparent),radial-gradient(0.8px 0.8px at 169px 21px,rgba(255,255,255,0.4),transparent),radial-gradient(0.9px 0.9px at 141px 21px,rgba(255,236,170,0.41),transparent),radial-gradient(0.7px 0.7px at 58px 131px,rgba(255,255,255,0.32),transparent),radial-gradient(0.6px 0.6px at 27px 102px,rgba(228,222,255,0.4),transparent),radial-gradient(0.9px 0.9px at 17px 4px,rgba(255,255,255,0.3),transparent),radial-gradient(0.8px 0.8px at 53px 13px,rgba(255,236,170,0.64),transparent);background-size:180px 170px;animation:d1 260s linear infinite}.l2{background-image:radial-gradient(1.3px 1.3px at 242px 137px,rgba(255,255,255,0.68),transparent),radial-gradient(1.0px 1.0px at 73px 195px,rgba(228,222,255,0.58),transparent),radial-gradient(1.3px 1.3px at 140px 235px,rgba(255,255,255,0.66),transparent),radial-gradient(1.3px 1.3px at 285px 0px,rgba(255,236,170,0.5),transparent),radial-gradient(1.1px 1.1px at 225px 188px,rgba(255,255,255,0.77),transparent),radial-gradient(1.4px 1.4px at 30px 295px,rgba(228,222,255,0.48),transparent),radial-gradient(1.3px 1.3px at 351px 172px,rgba(255,255,255,0.73),transparent),radial-gradient(1.5px 1.5px at 44px 9px,rgba(255,236,170,0.74),transparent),radial-gradient(1.1px 1.1px at 338px 260px,rgba(255,255,255,0.8),transparent),radial-gradient(1.1px 1.1px at 216px 227px,rgba(228,222,255,0.6),transparent),radial-gradient(1.2px 1.2px at 69px 276px,rgba(255,255,255,0.67),transparent),radial-gradient(1.3px 1.3px at 83px 26px,rgba(255,236,170,0.63),transparent);background-size:390px 310px;opacity:.9;animation:d2 160s linear infinite}.l3{background-image:radial-gradient(2.1px 2.1px at 132px 297px,rgba(255,255,255,0.84),transparent),radial-gradient(2.1px 2.1px at 95px 236px,rgba(228,222,255,0.9),transparent),radial-gradient(1.7px 1.7px at 328px 191px,rgba(255,255,255,0.79),transparent),radial-gradient(1.6px 1.6px at 109px 301px,rgba(255,236,170,0.64),transparent),radial-gradient(2.4px 2.4px at 350px 14px,rgba(255,255,255,0.89),transparent),radial-gradient(2.3px 2.3px at 43px 268px,rgba(228,222,255,0.86),transparent),radial-gradient(1.9px 1.9px at 71px 262px,rgba(255,255,255,0.68),transparent);background-size:390px 600px;animation:d3 85s linear infinite}@keyframes d1{from{background-position:0 0}to{background-position:0 170px}}@keyframes d2{from{background-position:0 0}to{background-position:0 310px}}@keyframes d3{from{background-position:0 0}to{background-position:0 600px}}.neb{position:absolute;border-radius:50%;filter:blur(38px);animation:neb 26s ease-in-out infinite alternate}@keyframes neb{from{transform:translate(0,0) scale(1)}to{transform:translate(22px,-16px) scale(1.16)}}@media (prefers-reduced-motion: reduce){.l1,.l2,.l3,.neb{animation:none}}
</style>
<style>html,body{background:#000}</style>

<body>

    <div style="display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 10px; font-weight: 500; color: rgba(225,228,245,0.62)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="color: currentColor" aria-hidden="true"><circle cx="12" cy="8.5" r="3.6"></circle><path d="M5 20.5c.9-3.9 3.6-6 7-6s6.1 2.1 7 6"></path></svg>Profile</div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 10px; font-weight: 500; color: rgba(225,228,245,0.62)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="color: currentColor" aria-hidden="true"><path d="M4 8h2.6M11.4 8H20M4 16h9.1M17.9 16H20"></path><circle cx="9" cy="8" r="2.4"></circle><circle cx="15.5" cy="16" r="2.4"></circle></svg>Settings</div>
