<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>Cue — Is it ready to post?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&amp;family=Geist+Mono:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.sheet{background:radial-gradient(80% 30% at 50% 0%,rgba(157,140,255,0.16),rgba(157,140,255,0) 70%),#161826;box-shadow:inset 0 0.5px 0 rgba(180,167,255,0.3),0 -20px 60px rgba(0,0,0,0.5)}
.row{background:linear-gradient(180deg,rgba(255,255,255,0.04),rgba(255,255,255,0) 50%),#1F2236;box-shadow:inset 0 0 0 0.5px rgba(180,167,255,0.14)}
@keyframes shimmer{0%{transform:translateX(-120%)}60%,100%{transform:translateX(220%)}}
.shimmer{animation:shimmer 3.2s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){.shimmer{animation:none;opacity:0}}
</style>
<style>html,body{background:#000}</style>
</head>
<body>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #0A0B12; font-family: Geist, -apple-system, sans-serif; color: #fff">
  <div style="position: absolute; left: 16px; right: 16px; top: 54px; height: 38px; display: flex; align-items: center; justify-content: space-between">
    <div style="width: 38px; height: 38px; border-radius: 19px; background: rgba(28,30,46,0.72)"></div>
    <div style="font-family: 'Geist Mono', monospace; font-size: 11px; font-weight: 700; letter-spacing: 0.8px; color: #64D2FF">IN EDIT <span style="color: rgba(225,228,245,0.45)">· AUTOSAVED</span></div>
    <div style="height: 34px; padding: 0 16px; border-radius: 17px; background: #FFD60A; color: #000; display: flex; align-items: center; font-size: 15px; font-weight: 700">Done</div>
  </div>
  <div style="position: absolute; left: 78px; top: 104px; width: 234px; height: 416px; border-radius: 18px; overflow: hidden">
    <img src="assets/creator.jpg" alt="" style="width: 100%; height: 100%; object-fit: cover; object-position: 42% 30%">
  </div>
  <div style="position: absolute; inset: 0; background: rgba(0,0,0,0.55)"></div>

  <div class="sheet" style="position: absolute; left: 0; right: 0; top: 424px; bottom: 0; border-radius: 34px 34px 0 0">
    <div style="position: absolute; left: 50%; top: 8px; width: 36px; height: 5px; border-radius: 3px; background: rgba(235,235,245,0.3); transform: translateX(-50%)"></div>
    <div style="position: absolute; left: 22px; right: 22px; top: 28px; display: flex; flex-direction: column; gap: 6px">
      <div style="font-family: 'Geist Mono', monospace; font-size: 11px; font-weight: 700; letter-spacing: 1.2px; color: rgba(225,228,245,0.55)">EDIT SAVED · 1:02</div>
      <div style="font-size: 26px; line-height: 30px; font-weight: 700; letter-spacing: -0.4px">Is it ready to post?</div>
    </div>

    <div style="position: absolute; left: 16px; right: 16px; top: 104px; display: flex; flex-direction: column; gap: 8px">
      <button style="position: relative; overflow: hidden; height: 66px; border-radius: 20px; border: 0; background: #FFD60A; color: #000; display: flex; align-items: center; gap: 12px; padding: 0 14px; text-align: left; font-family: inherit; box-shadow: 0 10px 28px rgba(255,214,10,0.22)">
        <span class="shimmer" style="position: absolute; top: 0; bottom: 0; left: 0; width: 40%; background: linear-gradient(100deg,rgba(255,255,255,0),rgba(255,255,255,0.45),rgba(255,255,255,0))"></span>
        <span style="position: relative; width: 36px; height: 36px; border-radius: 12px; background: rgba(0,0,0,0.1); display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="15" height="17" viewBox="0 0 12 14" fill="none" stroke="#000" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9V1.5M2.8 4.5L6 1.5l3.2 3M1 8v4.5h10V8"></path></svg></span>
        <span style="position: relative; flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 17px; font-weight: 700">Yes — share to social media</span><span style="font-size: 13px; color: rgba(0,0,0,0.6)">Pick the app in the share sheet</span></span>
        <span style="position: relative; height: 24px; padding: 0 8px; border-radius: 12px; background: rgba(10,11,18,0.85); color: #E4DEFF; display: flex; align-items: center; gap: 5px; font-family: 'Geist Mono', monospace; font-size: 10px; font-weight: 800; letter-spacing: 0.5px"><span style="color: #FFD60A; font-size: 9px">✦</span>SHARED</span>
      </button>
      <button class="row" style="height: 64px; border-radius: 20px; border: 0; color: #fff; display: flex; align-items: center; gap: 12px; padding: 0 14px; text-align: left; font-family: inherit">
        <span style="width: 36px; height: 36px; border-radius: 12px; background: rgba(255,255,255,0.08); display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7.5 10.5L12 15l4.5-4.5M5 20h14"></path></svg></span>
        <span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 16px; font-weight: 600">Download video</span><span style="font-size: 13px; color: rgba(235,235,245,0.6)">Saves to Photos · post it anywhere</span></span>
        <span style="height: 24px; padding: 0 8px; border-radius: 12px; background: rgba(10,11,18,0.7); box-shadow: inset 0 0 0 1px rgba(255,255,255,0.18); display: flex; align-items: center; gap: 5px; font-family: 'Geist Mono', monospace; font-size: 10px; font-weight: 800; letter-spacing: 0.5px; color: rgba(225,228,245,0.85)"><span style="width: 5px; height: 5px; border-radius: 3px; background: rgba(225,228,245,0.85)"></span>SAVED</span>
      </button>
      <button class="row" style="height: 64px; border-radius: 20px; border: 0; color: #fff; display: flex; align-items: center; gap: 12px; padding: 0 14px; text-align: left; font-family: inherit">
        <span style="width: 36px; height: 36px; border-radius: 12px; background: rgba(52,199,89,0.14); display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="16" height="13" viewBox="0 0 13 10" fill="none" stroke="#34C759" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 5.2l3.4 3.3L11.5 1.5"></path></svg></span>
        <span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 16px; font-weight: 600">Ready, I'll post later</span><span style="font-size: 13px; color: rgba(235,235,245,0.6)">Goes to Ready in Takes</span></span>
        <span style="height: 24px; padding: 0 8px; border-radius: 12px; background: rgba(10,11,18,0.7); box-shadow: inset 0 0 0 1px rgba(52,199,89,0.5); display: flex; align-items: center; gap: 5px; font-family: 'Geist Mono', monospace; font-size: 10px; font-weight: 800; letter-spacing: 0.5px; color: #34C759"><span style="width: 5px; height: 5px; border-radius: 3px; background: #34C759; box-shadow: 0 0 6px #34C759"></span>READY</span>
      </button>
      <button class="row" style="height: 64px; border-radius: 20px; border: 0; color: #fff; display: flex; align-items: center; gap: 12px; padding: 0 14px; text-align: left; font-family: inherit">
        <span style="width: 36px; height: 36px; border-radius: 12px; background: rgba(100,210,255,0.12); display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#64D2FF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"></circle><path d="M12 8v4l3 2"></path></svg></span>
        <span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 16px; font-weight: 600">Not yet, I'll come back</span><span style="font-size: 13px; color: rgba(235,235,245,0.6)">Stays in edit · autosaved</span></span>
        <span style="height: 24px; padding: 0 8px; border-radius: 12px; background: rgba(10,11,18,0.7); box-shadow: inset 0 0 0 1px rgba(100,210,255,0.45); display: flex; align-items: center; gap: 5px; font-family: 'Geist Mono', monospace; font-size: 10px; font-weight: 800; letter-spacing: 0.5px; color: #64D2FF"><span style="width: 5px; height: 5px; border-radius: 3px; background: #64D2FF; box-shadow: 0 0 6px #64D2FF"></span>IN EDIT</span>
      </button>
    </div>
  </div>
</div>
</body>
</html>
