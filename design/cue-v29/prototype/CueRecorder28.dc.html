<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?display=swap" rel="stylesheet">
<style>
@keyframes recFocus{0%{box-shadow:0 0 0 0 rgba(255,214,10,0),inset 0 0 0 1px rgba(255,214,10,0)}35%{box-shadow:0 0 0 6px rgba(255,214,10,0.10),inset 0 0 0 1px rgba(255,214,10,0.55)}100%{box-shadow:0 0 0 14px rgba(255,214,10,0),inset 0 0 0 1px rgba(255,214,10,0)}}
@keyframes recDot{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes recBarIn{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
@keyframes recFade{from{opacity:0}to{opacity:1}}
@keyframes recCount{0%{opacity:0;transform:scale(1.25)}20%{opacity:1;transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:scale(.9)}}
@keyframes recSheet{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
</style>
</helmet>
<div style="position:relative;width:390px;height:844px;overflow:hidden;background:#05060B;color:#fff;font-family:-apple-system,'SF Pro Text',system-ui,sans-serif;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none" onClick="{{ peekBar }}">

  <sc-if value="{{ selfie }}" hint-placeholder-val="{{ true }}">
    <div style="position:absolute;inset:0;background:url(cue-universe-v28/boards/assets/creator.jpg) center 30%/cover;transform:{{ camFlip }};transition:transform .35s"></div>
    <div style="position:absolute;inset:0;background:linear-gradient(to bottom,rgba(5,6,11,0.35),rgba(5,6,11,0) 22%,rgba(5,6,11,0) 58%,rgba(5,6,11,0.55))"></div>
  </sc-if>
  <sc-if value="{{ studio }}" hint-placeholder-val="{{ false }}">
    <div style="position:absolute;inset:0;background:radial-gradient(70% 40% at 50% 0%,rgba(157,140,255,0.10),rgba(0,0,0,0) 70%),#05060B"></div>
    <div style="position:absolute;right:14px;top:112px;width:64px;height:114px;border-radius:13px;overflow:hidden;z-index:6;box-shadow:0 0 0 1px {{ pipRing }},0 10px 24px rgba(0,0,0,0.5);transition:box-shadow .3s">
      <div style="position:absolute;inset:0;background:url(cue-universe-v28/boards/assets/creator.jpg) center 30%/cover"></div>
      <div style="position:absolute;left:6px;bottom:5px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:8.5px;font-weight:700;letter-spacing:.08em;color:rgba(255,255,255,0.85)">BACK CAM</div>
    </div>
  </sc-if>
  <sc-if value="{{ grid }}">
    <div style="position:absolute;inset:0;pointer-events:none;z-index:1">
      <div style="position:absolute;top:0;bottom:0;left:33.33%;width:0.5px;background:rgba(255,255,255,0.22)"></div>
      <div style="position:absolute;top:0;bottom:0;left:66.66%;width:0.5px;background:rgba(255,255,255,0.22)"></div>
      <div style="position:absolute;left:0;right:0;top:33.33%;height:0.5px;background:rgba(255,255,255,0.22)"></div>
      <div style="position:absolute;left:0;right:0;top:66.66%;height:0.5px;background:rgba(255,255,255,0.22)"></div>
    </div>
  </sc-if>
  <div style="position:absolute;inset:0;pointer-events:none;z-index:2;background:radial-gradient(120% 80% at 50% 45%,rgba(0,0,0,0) 55%,rgba(0,0,0,0.42));opacity:{{ vignette }};transition:opacity .8s ease"></div>

  <div data-box="1" style="position:absolute;z-index:3;left:{{ bx.l }};right:{{ bx.r }};top:{{ bx.t }};height:{{ bx.h }};border-radius:24px;overflow:hidden;background:{{ bx.bg }};backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:inset 0 0 0 0.5px {{ bx.rim }};transition:{{ bx.tr }}">
    <div style="position:absolute;inset:0;border-radius:24px;pointer-events:none;animation:{{ bx.anim }}"></div>
    <div style="position:absolute;left:0;right:0;top:12px;padding:0 16px;display:flex;justify-content:space-between;align-items:center;z-index:2;pointer-events:none;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:9.5px;font-weight:600;letter-spacing:.1em;color:rgba(225,228,245,0.5)">
      <span>{{ secL }}</span><span style="color:{{ modeTagC }}">{{ modeTag }}</span>
    </div>
    <div onPointerDown="{{ textDown }}" style="position:absolute;inset:0;cursor:grab;touch-action:none;-webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 34px,#000 calc(100% - 26px),transparent);mask-image:linear-gradient(to bottom,transparent 0,#000 34px,#000 calc(100% - 26px),transparent)">
      <div ref="{{ setScroll }}" style="padding:{{ bx.padT }} {{ bx.padX }} 320px;font-size:{{ bx.fs }};line-height:1.32;font-weight:600;letter-spacing:-0.2px;text-wrap:pretty;transform:{{ scrollT }};transition:{{ scrollTr }};{{ mirrorCss }}">
        <sc-for list="{{ words }}" as="w" hint-placeholder-count="40"><span data-w="{{ w.i }}" style="color:{{ w.c }};transition:color .25s">{{ w.t }}</span><sc-if value="{{ w.cue }}"><span style="display:inline-block;margin:0 6px;padding:2px 7px;border-radius:6px;vertical-align:3px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:10px;font-weight:700;letter-spacing:.08em;color:#FFD60A;background:rgba(255,214,10,0.10);box-shadow:inset 0 0 0 0.5px rgba(255,214,10,0.35)">{{ w.cueL }}</span></sc-if><sc-if value="{{ w.br }}"><span style="display:block;height:0.55em"></span></sc-if> </sc-for>
      </div>
    </div>
    <div style="position:absolute;left:10px;right:10px;top:{{ ln.y }};height:0;pointer-events:none;display:flex;align-items:center;z-index:2;opacity:{{ ln.op }};transition:opacity .3s">
      <div style="width:0;height:0;border-top:5px solid transparent;border-bottom:5px solid transparent;border-left:7px solid rgba(255,214,10,0.85)"></div>
      <div style="flex:1;height:1.5px;background:linear-gradient(90deg,rgba(255,214,10,0.55),rgba(255,214,10,0.18) 50%,rgba(255,214,10,0.55))"></div>
      <div style="width:0;height:0;border-top:5px solid transparent;border-bottom:5px solid transparent;border-right:7px solid rgba(255,214,10,0.85)"></div>
    </div>
    <sc-if value="{{ dragOn }}"><div style="position:absolute;inset:0;border-radius:24px;box-shadow:inset 0 0 0 1.5px #FFD60A;pointer-events:none;z-index:4;animation:recFade .15s"></div></sc-if>
  </div>

  <sc-if value="{{ handles }}">
    <div onPointerDown="{{ lineDown }}" title="Drag to move the reading line" style="position:absolute;z-index:7;left:{{ pin.x }};top:{{ pin.y }};width:34px;height:52px;margin:-26px 0 0 -17px;display:flex;align-items:center;justify-content:center;cursor:ns-resize;touch-action:none">
      <div style="width:14px;height:36px;border-radius:7px;background:{{ pin.bg }};box-shadow:inset 0 0 0 0.5px rgba(255,255,255,0.32),0 2px 8px rgba(0,0,0,0.4);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;transition:background .2s">
        <span style="width:6px;height:1.5px;border-radius:1px;background:{{ pin.fg }}"></span><span style="width:6px;height:1.5px;border-radius:1px;background:{{ pin.fg }}"></span><span style="width:6px;height:1.5px;border-radius:1px;background:{{ pin.fg }}"></span>
      </div>
    </div>
    <div onPointerDown="{{ sizeDown }}" onDoubleClick="{{ sizeReset }}" title="Drag to resize · double-tap to reset" style="position:absolute;z-index:7;left:{{ rz.x }};top:{{ rz.y }};width:44px;height:44px;margin:-30px 0 0 -30px;display:flex;align-items:center;justify-content:center;cursor:nwse-resize;touch-action:none">
      <div style="width:14px;height:14px;border-right:2.5px solid #FFD60A;border-bottom:2.5px solid #FFD60A;border-bottom-right-radius:7px;filter:drop-shadow(0 1px 2px rgba(0,0,0,0.6))"></div>
    </div>
  </sc-if>
  <sc-if value="{{ dragOn }}">
    <div style="position:absolute;z-index:8;left:{{ tipX }};top:{{ tip.y }};transform:translateX(-50%);height:26px;padding:0 11px;border-radius:13px;background:rgba(10,11,18,0.88);box-shadow:inset 0 0 0 0.5px rgba(255,214,10,0.45);display:flex;align-items:center;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;font-weight:600;letter-spacing:.06em;color:#FFE680;white-space:nowrap;pointer-events:none">{{ tip.l }}</div>
  </sc-if>

  <sc-if value="{{ counting }}">
    <div style="position:absolute;z-index:9;left:0;right:0;top:{{ cnt.y }};display:flex;justify-content:center;pointer-events:none">
      <div style="font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:64px;font-weight:600;color:rgba(255,255,255,0.92);text-shadow:0 2px 16px rgba(0,0,0,0.5)">{{ cntEl }}</div>
    </div>
  </sc-if>

  <div style="position:absolute;top:54px;left:14px;right:14px;height:44px;z-index:10;display:flex;align-items:center;justify-content:space-between;gap:8px">
    <sc-if value="{{ notRec }}" hint-placeholder-val="{{ true }}">
      <div onClick="{{ close }}" aria-label="Close" style="width:40px;height:40px;border-radius:20px;background:rgba(14,16,28,0.55);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:inset 0 0 0 0.5px rgba(180,167,255,0.22);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#fff" style="stroke-width:2.6;stroke-linecap:round"><path d="M6 6l12 12M18 6L6 18"></path></svg></div>
      <div style="display:flex;gap:2px;padding:2px;border-radius:20px;background:rgba(14,16,28,0.55);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:inset 0 0 0 0.5px rgba(180,167,255,0.22)">
        <sc-for list="{{ camSeg }}" as="o" hint-placeholder-count="2"><div onClick="{{ o.pick }}" style="height:34px;padding:0 14px;border-radius:17px;background:{{ o.bg }};display:flex;align-items:center;font-size:13.5px;font-weight:{{ o.fw }};color:{{ o.fg }};cursor:pointer">{{ o.l }}</div></sc-for>
      </div>
      <div onClick="{{ cycleTimer }}" style="height:40px;min-width:40px;padding:0 11px;box-sizing:border-box;border-radius:20px;background:rgba(14,16,28,0.55);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:inset 0 0 0 0.5px rgba(180,167,255,0.22);display:flex;align-items:center;justify-content:center;gap:5px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:12px;font-weight:600;color:{{ timerC }};cursor:pointer;flex-shrink:0"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" style="stroke-width:2;stroke-linecap:round"><circle cx="12" cy="13" r="8"></circle><path d="M12 9v4l2.5 2M9.5 2.5h5"></path></svg>{{ timerL }}</div>
    </sc-if>
    <sc-if value="{{ rec }}" hint-placeholder-val="{{ false }}">
      <div style="margin:0 auto;height:32px;padding:0 13px;border-radius:16px;background:rgba(14,16,28,0.6);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);display:flex;align-items:center;gap:8px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:12.5px;font-weight:600;letter-spacing:.06em;animation:recFade .4s"><span style="width:8px;height:8px;border-radius:4px;background:#FF453A;animation:recDot 1.6s ease-in-out infinite"></span><span style="color:rgba(255,255,255,0.85)">REC</span></div>
    </sc-if>
  </div>

  <sc-if value="{{ fullBar }}" hint-placeholder-val="{{ true }}">
    <div onClick="{{ stopProp }}" style="position:absolute;left:10px;right:10px;bottom:24px;z-index:10;border-radius:36px;background:rgba(14,16,28,0.80);backdrop-filter:blur(26px) saturate(150%);-webkit-backdrop-filter:blur(26px) saturate(150%);box-shadow:inset 0 0 0 0.5px rgba(180,167,255,0.22),0 -10px 40px rgba(0,0,0,0.35);padding:12px 12px 12px;display:flex;flex-direction:column;gap:9px;animation:recBarIn .35s cubic-bezier(.2,.9,.25,1)">
      <div style="display:flex;align-items:center;gap:8px">
        <div style="flex:1;display:flex;gap:2px;padding:2px;border-radius:12px;background:rgba(110,116,150,0.26)">
          <sc-for list="{{ modeSeg }}" as="o" hint-placeholder-count="2"><div onClick="{{ o.pick }}" style="flex:1;height:38px;border-radius:10px;background:{{ o.bg }};display:flex;align-items:center;justify-content:center;gap:6px;font-size:14px;font-weight:{{ o.fw }};color:{{ o.fg }};cursor:pointer;transition:background .2s"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" style="stroke-width:2;stroke-linecap:round;stroke-linejoin:round"><path d="{{ o.ic }}"></path></svg>{{ o.l }}</div></sc-for>
        </div>
        <div onClick="{{ toTop }}" aria-label="Back to the top" style="width:42px;height:42px;border-radius:21px;background:rgba(110,116,150,0.26);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#fff" style="stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round"><path d="M5 4h14M12 20V9M7 13l5-5 5 5"></path></svg></div>
        <div onClick="{{ togglePlay }}" aria-label="Play prompter" style="width:42px;height:42px;border-radius:21px;background:rgba(110,116,150,0.26);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0"><svg width="16" height="16" viewBox="0 0 24 24" fill="#fff"><path d="{{ playIc }}"></path></svg></div>
        <div onClick="{{ textSize }}" aria-label="Text size" style="width:42px;height:42px;border-radius:21px;background:rgba(110,116,150,0.26);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;font-size:15px;font-weight:700">Aa</div>
      </div>
      <sc-if value="{{ steady }}">
        <div style="display:flex;align-items:center;gap:10px;height:30px;padding:0 4px">
          <span style="font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:10px;font-weight:700;letter-spacing:.1em;color:rgba(225,228,245,0.55)">SPEED</span>
          <div onPointerDown="{{ speedDown }}" role="slider" aria-label="Scroll speed" aria-valuemin="80" aria-valuemax="220" aria-valuenow="{{ spdV }}" aria-valuetext="{{ spd.l }}" style="position:relative;flex:1;height:30px;cursor:pointer;touch-action:none">
            <div style="position:absolute;left:12px;right:12px;top:0;bottom:0">
              <div style="position:absolute;left:0;right:0;top:13px;height:4px;border-radius:2px;background:rgba(120,120,128,0.32)"></div>
              <div style="position:absolute;left:0;top:13px;height:4px;border-radius:2px;width:{{ spd.p }};background:#FFD60A"></div>
              <div style="position:absolute;left:{{ spd.p }};top:-4px;width:38px;height:38px;margin-left:-19px;border-radius:19px;background:rgba(255,214,10,0.16);opacity:{{ spd.h }};transition:opacity .15s"></div>
              <div style="position:absolute;top:3px;left:{{ spd.p }};width:24px;height:24px;margin-left:-12px;border-radius:12px;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,0.35),0 0 0 0.5px rgba(0,0,0,0.12);transform:{{ spd.s }};transition:transform .15s ease-out"></div>
            </div>
          </div>
          <span style="font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:12.5px;font-weight:600;color:{{ spd.c }};min-width:62px;text-align:right;transition:color .15s">{{ spd.l }}</span>
        </div>
        <div style="display:flex;justify-content:space-between;margin:-6px 70px 0 58px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:9.5px;font-weight:600;letter-spacing:.06em;color:rgba(225,228,245,0.4)"><span>80</span><span>220 WPM</span></div>
      
      </sc-if>
      <sc-if value="{{ voice }}">
        <div style="display:flex;align-items:center;gap:8px;height:30px;padding:0 6px;font-size:13px;color:rgba(225,228,245,0.7)">
          <div style="display:flex;align-items:center;gap:2px;height:14px"><sc-for list="{{ wave }}" as="b" hint-placeholder-count="5"><span style="width:2.5px;height:{{ b }};border-radius:2px;background:#B4A7FF;transition:height .2s"></span></sc-for></div>
          <span>{{ voiceHint }}</span>
        </div>
      </sc-if>
      <div onClick="{{ openMic }}" style="display:flex;align-items:center;justify-content:center;gap:7px;height:24px;cursor:pointer;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:10.5px;font-weight:600;letter-spacing:.08em;color:rgba(225,228,245,0.62)"><span style="width:6px;height:6px;border-radius:3px;background:#34C759"></span>{{ hud }}<span style="color:rgba(225,228,245,0.35)">›</span></div>
      <div style="display:flex;align-items:center;justify-content:space-between;padding:0 8px">
        <div onClick="{{ lastTake }}" aria-label="Last take" style="position:relative;width:44px;height:44px;border-radius:12px;background:url(cue-universe-v28/boards/assets/creator.jpg) center 30%/cover;box-shadow:inset 0 0 0 1px rgba(255,255,255,0.25);cursor:pointer"><span style="position:absolute;right:-5px;top:-5px;min-width:18px;height:18px;padding:0 4px;box-sizing:border-box;border-radius:9px;background:#FFD60A;color:#000;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center">{{ takesN }}</span></div>
        <div onClick="{{ openCam }}" aria-label="Camera settings" style="width:40px;height:40px;border-radius:20px;background:rgba(110,116,150,0.26);display:flex;align-items:center;justify-content:center;cursor:pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" style="stroke-width:1.9;stroke-linecap:round"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"></path><circle cx="16" cy="7" r="2"></circle><circle cx="8" cy="17" r="2"></circle></svg></div>
        <div onClick="{{ startRec }}" aria-label="Record" style="width:74px;height:74px;border-radius:37px;box-shadow:inset 0 0 0 3.5px #fff;display:flex;align-items:center;justify-content:center;cursor:pointer" style-active="transform:scale(0.96)"><div style="width:{{ recBtn.s }};height:{{ recBtn.s }};border-radius:{{ recBtn.r }};background:#FF3B30;transition:all .35s cubic-bezier(.3,.8,.3,1)"></div></div>
        <div onClick="{{ flip }}" aria-label="Flip camera" style="width:40px;height:40px;border-radius:20px;background:rgba(110,116,150,0.26);display:flex;align-items:center;justify-content:center;cursor:pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" style="stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round"><path d="M20 11a8 8 0 00-14.3-4.9L4 8M4 13a8 8 0 0014.3 4.9L20 16M4 4v4h4M20 20v-4h-4"></path></svg></div>
        <div onClick="{{ openMore }}" aria-label="More" style="width:44px;height:44px;display:flex;align-items:center;justify-content:center;cursor:pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="#fff"><circle cx="5" cy="12" r="1.8"></circle><circle cx="12" cy="12" r="1.8"></circle><circle cx="19" cy="12" r="1.8"></circle></svg></div>
      </div>
    </div>
  </sc-if>

  <sc-if value="{{ compactBar }}" hint-placeholder-val="{{ false }}">
    <div onClick="{{ stopProp }}" style="position:absolute;left:14px;right:14px;bottom:34px;z-index:10;height:72px;border-radius:36px;background:rgba(14,16,28,0.72);backdrop-filter:blur(26px);-webkit-backdrop-filter:blur(26px);box-shadow:inset 0 0 0 0.5px rgba(180,167,255,0.2);display:flex;align-items:center;gap:8px;padding:0 10px 0 12px;animation:recBarIn .45s cubic-bezier(.2,.9,.25,1)">
      <div onClick="{{ toggleMode }}" style="height:30px;padding:0 10px;border-radius:15px;background:rgba(110,116,150,0.26);display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:10.5px;font-weight:700;letter-spacing:.08em;color:{{ modeTagC }};cursor:pointer;white-space:nowrap">{{ modeTag }}</div>
      <div onClick="{{ toTop }}" aria-label="Back to the top" style="width:40px;height:40px;border-radius:20px;display:flex;align-items:center;justify-content:center;cursor:pointer"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#fff" style="stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round"><path d="M5 4h14M12 20V9M7 13l5-5 5 5"></path></svg></div>
      <div onClick="{{ togglePlay }}" aria-label="Pause prompter" style="width:40px;height:40px;border-radius:20px;display:flex;align-items:center;justify-content:center;cursor:pointer"><svg width="15" height="15" viewBox="0 0 24 24" fill="#fff"><path d="{{ playIc }}"></path></svg></div>
      <div style="flex:1"></div>
      <div style="display:flex;flex-direction:column;align-items:flex-end;gap:1px;font-family:ui-monospace,'SF Mono',Menlo,monospace"><span style="font-size:15px;font-weight:600;color:#FFD60A;letter-spacing:.04em">{{ timeL }}</span><span style="font-size:9px;font-weight:600;letter-spacing:.1em;color:rgba(225,228,245,0.5);white-space:nowrap">{{ takeL }}</span></div>
      <div onClick="{{ stop }}" aria-label="Stop recording" style="width:54px;height:54px;border-radius:27px;box-shadow:inset 0 0 0 3px #fff;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0"><div style="width:22px;height:22px;border-radius:6px;background:#FF3B30"></div></div>
    </div>
  </sc-if>

  <sc-if value="{{ hasSheet }}" hint-placeholder-val="{{ false }}">
    <div onClick="{{ closeSheet }}" style="position:absolute;inset:0;z-index:20;background:rgba(5,6,12,0.45);animation:recFade .2s"></div>
