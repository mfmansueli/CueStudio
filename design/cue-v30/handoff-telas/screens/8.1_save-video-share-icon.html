,rgba(255,255,255,0.73),transparent),radial-gradient(1.5px 1.5px at 44px 9px,rgba(255,236,170,0.74),transparent),radial-gradient(1.1px 1.1px at 338px 260px,rgba(255,255,255,0.8),transparent),radial-gradient(1.1px 1.1px at 216px 227px,rgba(228,222,255,0.6),transparent),radial-gradient(1.2px 1.2px at 69px 276px,rgba(255,255,255,0.67),transparent),radial-gradient(1.3px 1.3px at 83px 26px,rgba(255,236,170,0.63),transparent);background-size:390px 310px;opacity:.9;animation:d2 160s linear infinite}.l3{background-image:radial-gradient(2.1px 2.1px at 132px 297px,rgba(255,255,255,0.84),transparent),radial-gradient(2.1px 2.1px at 95px 236px,rgba(228,222,255,0.9),transparent),radial-gradient(1.7px 1.7px at 328px 191px,rgba(255,255,255,0.79),transparent),radial-gradient(1.6px 1.6px at 109px 301px,rgba(255,236,170,0.64),transparent),radial-gradient(2.4px 2.4px at 350px 14px,rgba(255,255,255,0.89),transparent),radial-gradient(2.3px 2.3px at 43px 268px,rgba(228,222,255,0.86),transparent),radial-gradient(1.9px 1.9px at 71px 262px,rgba(255,255,255,0.68),transparent);background-size:390px 600px;animation:d3 85s linear infinite}@keyframes d1{from{background-position:0 0}to{background-position:0 170px}}@keyframes d2{from{background-position:0 0}to{background-position:0 310px}}@keyframes d3{from{background-position:0 0}to{background-position:0 600px}}.neb{position:absolute;border-radius:50%;filter:blur(38px);animation:neb 26s ease-in-out infinite alternate}@keyframes neb{from{transform:translate(0,0) scale(1)}to{transform:translate(22px,-16px) scale(1.16)}}@media (prefers-reduced-motion: reduce){.l1,.l2,.l3,.neb{animation:none}}
